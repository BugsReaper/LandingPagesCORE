<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title id="page-title"></title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Syne:wght@400;500;700&display=swap" rel="stylesheet"/>
  <style>
    :root {
      /* ── Colores inyectados por CONFIG ── */
      --bg:        #0c0c0c;
      --surface:   #141414;
      --border:    rgba(255,255,255,0.08);
      --border-hi: rgba(255,255,255,0.18);
      --white:     #f0ede8;
      --white-dim: rgba(240,237,232,0.45);
      --white-mid: rgba(240,237,232,0.7);
      --gold:      #c8a96e;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      background: var(--bg); color: var(--white);
      font-family: 'Syne', sans-serif; font-weight: 400;
      cursor: none; overflow-x: hidden;
    }
    body::before {
      content: ''; position: fixed; inset: 0; z-index: 0;
      pointer-events: none; opacity: 0.022;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      background-size: 200px;
    }
    #cursor {
      position: fixed; z-index: 9999; width: 8px; height: 8px;
      background: var(--gold); border-radius: 50%; pointer-events: none;
      transform: translate(-50%,-50%); transition: width .22s, height .22s;
    }
    #cursor-ring {
      position: fixed; z-index: 9998; width: 34px; height: 34px;
      border: 1px solid rgba(200,169,110,0.45); border-radius: 50%;
      pointer-events: none; transform: translate(-50%,-50%);
      transition: width .32s ease, height .32s ease, border-color .25s;
    }
    body.cursor-hover #cursor      { width: 5px; height: 5px; }
    body.cursor-hover #cursor-ring { width: 50px; height: 50px; border-color: rgba(240,237,232,0.25); }
    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 500;
      display: flex; justify-content: space-between; align-items: center;
      padding: 1.75rem 4vw;
      transition: background .4s, border-color .4s;
      border-bottom: 1px solid transparent;
    }
    nav.scrolled { background: rgba(12,12,12,.9); backdrop-filter: blur(16px); border-color: var(--border); }
    .nav-logo {
      font-family: 'Cormorant Garamond', serif; font-size: 1rem; font-weight: 300;
      letter-spacing: 0.2em; text-transform: uppercase; color: var(--white); text-decoration: none;
    }
    .nav-right { display: flex; align-items: center; gap: 2.5rem; }
    .nav-links { display: flex; gap: 2rem; list-style: none; }
    .nav-links a {
      font-size: 0.7rem; font-weight: 500; letter-spacing: 0.15em; text-transform: uppercase;
      color: var(--white-dim); text-decoration: none; transition: color .2s; position: relative;
    }
    .nav-links a::after {
      content: ''; position: absolute; bottom: -3px; left: 0;
      width: 0; height: 1px; background: var(--gold); transition: width .3s;
    }
    .nav-links a:hover { color: var(--white); }
    .nav-links a:hover::after { width: 100%; }
    .nav-cta {
      font-size: 0.7rem; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase;
      color: var(--bg); background: var(--white); padding: .6rem 1.5rem;
      border-radius: 2px; text-decoration: none; transition: background .2s, color .2s;
    }
    .nav-cta:hover { background: var(--gold); }
    #hero {
      position: relative; min-height: 100vh;
      display: flex; flex-direction: column; justify-content: flex-end;
      padding: 0 4vw; overflow: hidden;
    }
    .hero-bg {
      position: absolute; inset: 0;
      background: radial-gradient(ellipse 60% 55% at 80% 35%, rgba(200,169,110,0.07) 0%, transparent 60%),
                  radial-gradient(ellipse 35% 45% at 15% 85%, rgba(192,57,43,0.04) 0%, transparent 55%);
    }
    .hero-index {
      position: absolute; top: 2rem; right: 4vw;
      font-size: 0.65rem; letter-spacing: 0.22em; text-transform: uppercase; color: var(--white-dim);
    }
    .hero-content { position: relative; z-index: 1; padding-top: 100px; }
    .hero-eyebrow { display: flex; align-items: center; gap: 1rem; margin-bottom: 2.5rem; animation: heroIn .9s .1s both; }
    .eyebrow-line { width: 40px; height: 1px; background: var(--gold); }
    .eyebrow-text { font-size: 0.7rem; font-weight: 500; letter-spacing: 0.2em; text-transform: uppercase; color: var(--gold); }
    .hero-title {
      font-family: 'Cormorant Garamond', serif; font-size: clamp(4.5rem, 9.5vw, 10.5rem);
      font-weight: 300; line-height: 0.9; letter-spacing: -0.025em; margin-bottom: 3.5rem;
      animation: heroIn .9s .25s both;
    }
    .hero-title em { font-style: italic; color: var(--white-mid); }
    .hero-bottom {
      display: flex; justify-content: space-between; align-items: flex-end;
      border-top: 1px solid var(--border); padding: 2rem 0;
      flex-wrap: wrap; gap: 1.5rem; animation: heroIn .8s .42s both;
    }
    .hero-desc { font-size: 0.88rem; line-height: 1.85; color: var(--white-mid); max-width: 400px; }
    .hero-scroll {
      display: flex; align-items: center; gap: .75rem;
      font-size: 0.65rem; letter-spacing: 0.2em; text-transform: uppercase;
      color: var(--white-dim); text-decoration: none; transition: color .2s;
    }
    .hero-scroll:hover { color: var(--gold); }
    .scroll-line { width: 1px; height: 48px; background: linear-gradient(to bottom, var(--gold), transparent); }
    .counter-strip {
      position: relative; z-index: 1; display: flex;
      border-top: 1px solid var(--border); animation: heroIn .8s .58s both;
    }
    .counter-item { flex: 1; padding: 1.6rem 4vw; border-right: 1px solid var(--border); }
    .counter-item:last-child { border-right: none; }
    .counter-num {
      font-family: 'Cormorant Garamond', serif; font-size: 2.6rem;
      font-weight: 300; line-height: 1; letter-spacing: -0.03em;
    }
    .counter-num sup { font-size: .9rem; vertical-align: super; opacity: .55; }
    .counter-label { font-size: 0.65rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--white-dim); margin-top: .4rem; }
    section { position: relative; z-index: 1; }
    .sec-header {
      display: flex; justify-content: space-between; align-items: flex-end;
      padding: 5.5rem 4vw 3rem; border-bottom: 1px solid var(--border);
      flex-wrap: wrap; gap: 1rem;
    }
    .sec-num { font-family: 'Cormorant Garamond', serif; font-size: 0.8rem; letter-spacing: 0.14em; color: var(--gold); }
    .sec-title {
      font-family: 'Cormorant Garamond', serif; font-size: clamp(2.5rem, 5vw, 4.5rem);
      font-weight: 300; letter-spacing: -0.02em; line-height: 1; margin-top: .5rem;
    }
    .sec-link { font-size: 0.7rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--white-dim); text-decoration: none; transition: color .2s; }
    .sec-link:hover { color: var(--gold); }
    .services-grid { display: grid; grid-template-columns: repeat(3,1fr); }
    .service-item {
      padding: 3rem 4vw; border-right: 1px solid var(--border);
      border-bottom: 1px solid var(--border); transition: background .3s;
    }
    .service-item:nth-child(3n) { border-right: none; }
    .service-item:hover { background: var(--surface); }
    .service-num { font-family: 'Cormorant Garamond', serif; font-size: .85rem; color: var(--gold); margin-bottom: 2rem; }
    .service-item h3 { font-family: 'Cormorant Garamond', serif; font-size: 1.6rem; font-weight: 400; letter-spacing: -.01em; margin-bottom: 1rem; }
    .service-item p { font-size: .84rem; line-height: 1.8; color: var(--white-mid); }
    .service-tags { display: flex; flex-wrap: wrap; gap: .4rem; margin-top: 1.5rem; }
    .stag {
      font-size: .65rem; letter-spacing: .1em; text-transform: uppercase;
      color: var(--white-dim); border: 1px solid var(--border);
      padding: .25rem .65rem; border-radius: 2px; transition: border-color .2s, color .2s;
    }
    .service-item:hover .stag { border-color: var(--border-hi); color: var(--white-mid); }
    .project-feature { display: grid; grid-template-columns: 1fr 1fr; border-bottom: 1px solid var(--border); }
    .pf-img { aspect-ratio: 4/3; overflow: hidden; }
    .pf-img img {
      width: 100%; height: 100%; object-fit: cover;
      filter: grayscale(25%) contrast(1.05); transition: transform .7s ease, filter .5s ease;
    }
    .project-feature:hover .pf-img img { transform: scale(1.04); filter: grayscale(0%); }
    .pf-content { padding: 4rem; display: flex; flex-direction: column; justify-content: space-between; border-left: 1px solid var(--border); }
    .pf-label { font-size: .68rem; letter-spacing: .2em; text-transform: uppercase; color: var(--gold); }
    .pf-title { font-family: 'Cormorant Garamond', serif; font-size: clamp(2rem,3.5vw,3.2rem); font-weight: 300; letter-spacing: -.02em; line-height: 1.05; margin: 1rem 0; }
    .pf-desc { font-size: .85rem; line-height: 1.85; color: var(--white-mid); }
    .pf-footer { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--border); padding-top: 1.5rem; }
    .pf-year { font-size: .7rem; color: var(--white-dim); letter-spacing: .1em; }
    .pf-cta { font-size: .7rem; letter-spacing: .14em; text-transform: uppercase; color: var(--white); text-decoration: none; transition: color .2s; }
    .pf-cta:hover { color: var(--gold); }
    .project-list { display: flex; flex-direction: column; }
    .project-row {
      display: grid; grid-template-columns: 72px 1fr 1fr auto;
      align-items: center; gap: 2rem; padding: 1.8rem 4vw;
      border-bottom: 1px solid var(--border); text-decoration: none;
      color: var(--white); transition: background .22s; cursor: none;
    }
    .project-row:hover { background: var(--surface); }
    .pr-num { font-family: 'Cormorant Garamond', serif; font-size: .85rem; color: var(--white-dim); }
    .pr-name { font-family: 'Cormorant Garamond', serif; font-size: 1.45rem; font-weight: 400; letter-spacing: -.01em; transition: color .2s; }
    .project-row:hover .pr-name { color: var(--gold); }
    .pr-type { font-size: .7rem; letter-spacing: .12em; text-transform: uppercase; color: var(--white-dim); }
    .pr-arrow { font-size: 1rem; color: var(--white-dim); transition: transform .3s, color .2s; }
    .project-row:hover .pr-arrow { transform: rotate(45deg); color: var(--gold); }
    .about-grid { display: grid; grid-template-columns: 1fr 1fr; }
    .about-img-col { border-right: 1px solid var(--border); overflow: hidden; }
    .about-img-col img { width: 100%; height: 100%; object-fit: cover; min-height: 540px; filter: grayscale(20%) contrast(1.08); transition: filter .5s; display: block; }
    .about-img-col:hover img { filter: grayscale(0%); }
    .about-text-col { padding: 4rem; display: flex; flex-direction: column; gap: 1.8rem; }
    .about-text-col p { font-size: .9rem; line-height: 1.9; color: var(--white-mid); }
    .about-text-col p strong { color: var(--white); font-weight: 500; }
    .exp-list { display: flex; flex-direction: column; }
    .exp-item { display: flex; justify-content: space-between; align-items: baseline; padding: 1rem 0; border-bottom: 1px solid var(--border); gap: 1rem; }
    .exp-item:first-child { border-top: 1px solid var(--border); }
    .exp-role { font-family: 'Cormorant Garamond', serif; font-size: 1.1rem; }
    .exp-company { font-size: .78rem; color: var(--white-mid); margin-top: .15rem; }
    .exp-period { font-size: .68rem; letter-spacing: .1em; color: var(--white-dim); white-space: nowrap; }
    #testimonial { padding: 7rem 4vw; text-align: center; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); }
    .tq { font-family: 'Cormorant Garamond', serif; font-size: clamp(1.6rem, 3.5vw, 2.8rem); font-weight: 300; font-style: italic; line-height: 1.45; color: var(--white); max-width: 800px; margin: 0 auto 2rem; letter-spacing: -.01em; }
    .ta { font-size: .72rem; letter-spacing: .18em; text-transform: uppercase; color: var(--gold); }
    #contacto { display: grid; grid-template-columns: 1fr 1fr; }
    .contact-left { padding: 6rem 4vw; border-right: 1px solid var(--border); display: flex; flex-direction: column; justify-content: space-between; }
    .contact-headline { font-family: 'Cormorant Garamond', serif; font-size: clamp(2.8rem,5vw,5rem); font-weight: 300; letter-spacing: -.025em; line-height: 1.02; }
    .contact-headline em { font-style: italic; color: var(--white-mid); }
    .contact-info { display: flex; flex-direction: column; gap: 1.2rem; }
    .contact-link { font-size: .84rem; color: var(--white-mid); text-decoration: none; display: flex; align-items: center; gap: .75rem; transition: color .2s; }
    .contact-link:hover { color: var(--gold); }
    .cl-label { font-size: .62rem; letter-spacing: .16em; text-transform: uppercase; color: var(--white-dim); width: 60px; flex-shrink: 0; }
    .contact-right { padding: 6rem 4vw; display: flex; flex-direction: column; gap: 1.2rem; }
    .cf-group { display: flex; flex-direction: column; gap: .5rem; }
    .cf-label { font-size: .62rem; letter-spacing: .16em; text-transform: uppercase; color: var(--white-dim); }
    .cf-input, .cf-textarea { background: transparent; border: none; border-bottom: 1px solid var(--border); padding: .75rem 0; color: var(--white); font-family: 'Syne', sans-serif; font-size: .9rem; outline: none; width: 100%; transition: border-color .2s; }
    .cf-input:focus, .cf-textarea:focus { border-color: var(--gold); }
    .cf-textarea { resize: none; height: 100px; }
    .cf-submit { margin-top: .75rem; align-self: flex-start; background: transparent; border: 1px solid var(--white); color: var(--white); font-family: 'Syne', sans-serif; font-size: .7rem; font-weight: 500; letter-spacing: .18em; text-transform: uppercase; padding: 1rem 2.5rem; cursor: none; transition: background .25s, color .25s, border-color .25s; }
    .cf-submit:hover { background: var(--gold); border-color: var(--gold); color: var(--bg); }
    footer { display: flex; justify-content: space-between; align-items: center; padding: 1.8rem 4vw; border-top: 1px solid var(--border); flex-wrap: wrap; gap: 1rem; }
    .footer-logo { font-family: 'Cormorant Garamond', serif; font-size: .9rem; letter-spacing: .2em; text-transform: uppercase; color: var(--white-dim); text-decoration: none; }
    .footer-copy { font-size: .68rem; color: var(--white-dim); letter-spacing: .05em; }
    .footer-soc { display: flex; gap: 1.5rem; }
    .footer-soc a { font-size: .65rem; letter-spacing: .14em; text-transform: uppercase; color: var(--white-dim); text-decoration: none; transition: color .2s; }
    .footer-soc a:hover { color: var(--gold); }
    .reveal { opacity: 0; transform: translateY(22px); transition: opacity .8s cubic-bezier(.25,.46,.45,.94), transform .8s cubic-bezier(.25,.46,.45,.94); }
    .reveal.visible { opacity: 1; transform: none; }
    .d1 { transition-delay: .1s; } .d2 { transition-delay: .2s; } .d3 { transition-delay: .3s; }
    @keyframes heroIn { from { opacity: 0; transform: translateY(36px); } to { opacity: 1; transform: translateY(0); } }
    @media (max-width: 900px) {
      .services-grid { grid-template-columns: 1fr 1fr; }
      .project-feature { grid-template-columns: 1fr; }
      .pf-img { display: none; } .pf-content { border-left: none; padding: 3rem 4vw; }
      .about-grid { grid-template-columns: 1fr; } .about-img-col { display: none; }
      #contacto { grid-template-columns: 1fr; }
      .contact-left { border-right: none; border-bottom: 1px solid var(--border); padding-bottom: 3rem; }
      .project-row { grid-template-columns: auto 1fr auto; } .pr-type { display: none; }
    }
    @media (max-width: 600px) {
      .services-grid { grid-template-columns: 1fr; } .service-item { border-right: none; }
      .nav-right .nav-links { display: none; }
      .counter-strip { flex-wrap: wrap; } .counter-item { min-width: 45%; }
    }
  </style>
</head>
<body>

<div id="cursor"></div>
<div id="cursor-ring"></div>

<nav id="nav">
  <a href="#hero" class="nav-logo" id="nav-logo"></a>
  <div class="nav-right">
    <ul class="nav-links">
      <li><a href="#servicios">Servicios</a></li>
      <li><a href="#proyectos">Proyectos</a></li>
      <li><a href="#sobre-mi">Sobre mí</a></li>
    </ul>
    <a href="#contacto" class="nav-cta">Contactar</a>
  </div>
</nav>

<section id="hero">
  <div class="hero-bg"></div>
  <span class="hero-index">Portafolio — <span id="hero-year"></span></span>
  <div class="hero-content">
    <div class="hero-eyebrow">
      <div class="eyebrow-line"></div>
      <span class="eyebrow-text" id="hero-role"></span>
    </div>
    <h1 class="hero-title" id="hero-title"></h1>
    <div class="hero-bottom">
      <p class="hero-desc" id="hero-desc"></p>
      <a href="#proyectos" class="hero-scroll">
        <div class="scroll-line"></div>
        Ver trabajo
      </a>
    </div>
  </div>
  <div class="counter-strip" id="counter-strip"></div>
</section>

<section id="servicios">
  <div class="sec-header reveal">
    <div>
      <div class="sec-num">01 — Servicios</div>
      <h2 class="sec-title">Qué ofrezco</h2>
    </div>
  </div>
  <div class="services-grid" id="services-grid"></div>
</section>

<section id="proyectos">
  <div class="sec-header reveal">
    <div>
      <div class="sec-num">02 — Proyectos</div>
      <h2 class="sec-title">Trabajo selecto</h2>
    </div>
    <a href="#" class="sec-link">Todos los proyectos ↗</a>
  </div>
  <div id="project-featured"></div>
  <div class="project-list" id="project-list"></div>
</section>

<section id="sobre-mi">
  <div class="sec-header reveal">
    <div>
      <div class="sec-num">03 — Sobre mí</div>
      <h2 class="sec-title">El perfil</h2>
    </div>
  </div>
  <div class="about-grid">
    <div class="about-img-col reveal">
      <img id="about-photo" src="" alt="Foto de perfil"/>
    </div>
    <div class="about-text-col reveal d2">
      <p id="about-p1"></p>
      <p id="about-p2"></p>
      <div class="exp-list" id="exp-list"></div>
    </div>
  </div>
</section>

<section id="testimonial">
  <p class="tq reveal" id="testimonial-quote"></p>
  <p class="ta reveal d1" id="testimonial-author"></p>
</section>

<section id="contacto">
  <div class="contact-left reveal">
    <div>
      <div class="sec-num" style="margin-bottom:1.5rem;">04 — Contacto</div>
      <h2 class="contact-headline" id="contact-headline"></h2>
    </div>
    <div class="contact-info" id="contact-info"></div>
  </div>
  <div class="contact-right reveal d2">
    <form onsubmit="handleSubmit(event)">
      <div class="cf-group">
        <label class="cf-label">Nombre</label>
        <input class="cf-input" type="text" placeholder="Tu nombre completo" required/>
      </div>
      <div class="cf-group">
        <label class="cf-label">Email</label>
        <input class="cf-input" type="email" placeholder="tu@correo.com" required/>
      </div>
      <div class="cf-group">
        <label class="cf-label">Tipo de proyecto</label>
        <input class="cf-input" type="text" placeholder="Ej: Landing page, app web..."/>
      </div>
      <div class="cf-group">
        <label class="cf-label">Mensaje</label>
        <textarea class="cf-textarea" placeholder="Cuéntame qué necesitas..." required></textarea>
      </div>
      <button type="submit" class="cf-submit">Enviar mensaje</button>
    </form>
  </div>
</section>

<footer>
  <a href="#hero" class="footer-logo" id="footer-logo"></a>
  <span class="footer-copy" id="footer-copy"></span>
  <div class="footer-soc" id="footer-soc"></div>
</footer>

<script>
/* ============================================================
   ██████╗ ██████╗ ███╗   ██╗███████╗██╗ ██████╗
  ██╔════╝██╔═══██╗████╗  ██║██╔════╝██║██╔════╝
  ██║     ██║   ██║██╔██╗ ██║█████╗  ██║██║  ███╗
  ██║     ██║   ██║██║╚██╗██║██╔══╝  ██║██║   ██║
  ╚██████╗╚██████╔╝██║ ╚████║██║     ██║╚██████╔╝
   ╚═════╝ ╚═════╝ ╚═╝  ╚═══╝╚═╝     ╚═╝ ╚═════╝

  Edita SOLO este bloque para personalizar el portafolio.
  No necesitas tocar nada más del archivo.
============================================================ */

const CONFIG = {

  /* ── IDENTIDAD ─────────────────────────────────────── */
  nombre:     "Juan García",          // Nombre completo del cliente
  iniciales:  "J. García",           // Aparece en nav y footer
  rol:        "Desarrollador Web & Diseñador UI",
  año:        "2025",

  /* ── PALETA DE COLORES ──────────────────────────────
     Cambia aquí para cambiar toda la estética.
     bg       → fondo principal
     surface  → fondo de cards / hover
     gold     → color de acento (links, bordes activos, hover)
  ─────────────────────────────────────────────────── */
  colores: {
    bg:      "#0c0c0c",   // oscuro estándar
    surface: "#141414",
    gold:    "#c8a96e",   // dorado cálido ← cambia esto para otro acento
    // Ejemplos alternativos:
    // gold: "#7eb8f7"    ← azul frío
    // gold: "#a8d5a2"    ← verde salvia
    // gold: "#e07b8a"    ← rosa profundo
  },

  /* ── HERO ───────────────────────────────────────────── */

/* ── Cursor ── */
const cur = document.getElementById('cursor');
const ring = document.getElementById('cursor-ring');
let mx=0,my=0,rx=0,ry=0;
document.addEventListener('mousemove', e => { mx=e.clientX; my=e.clientY; });
(function tick(){
  rx+=(mx-rx)*.16; ry+=(my-ry)*.16;
  cur.style.left=mx+'px'; cur.style.top=my+'px';
  ring.style.left=rx+'px'; ring.style.top=ry+'px';
  requestAnimationFrame(tick);
})();
document.querySelectorAll('a,button,.project-row,.service-item').forEach(el=>{
  el.addEventListener('mouseenter',()=>document.body.classList.add('cursor-hover'));
  el.addEventListener('mouseleave',()=>document.body.classList.remove('cursor-hover'));
});

/* ── Nav scroll ── */
const nav = document.getElementById('nav');
window.addEventListener('scroll',()=>nav.classList.toggle('scrolled',scrollY>60));

/* ── Reveal ── */
const obs = new IntersectionObserver(entries=>{
  entries.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add('visible'); obs.unobserve(e.target); }});
},{threshold:0.07});
document.querySelectorAll('.reveal').forEach(el=>obs.observe(el));

/* ── Form ── */
function handleSubmit(e){
  e.preventDefault();
  const btn=e.target.querySelector('.cf-submit');
  btn.textContent='Enviado ✓';
  btn.style.background='var(--gold)';
  btn.style.borderColor='var(--gold)';
  btn.style.color='var(--bg)';
  btn.disabled=true;
  setTimeout(()=>{
    btn.textContent='Enviar mensaje';
    btn.style.background=''; btn.style.borderColor=''; btn.style.color='';
    btn.disabled=false; e.target.reset();
  },3500);
}
