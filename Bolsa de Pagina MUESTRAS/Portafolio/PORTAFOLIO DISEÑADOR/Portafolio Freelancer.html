<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="page-title"></title>
  <!-- Fuentes: una para títulos con personalidad, otra para texto muy legible -->
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;800&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    /* Variables – paleta base neutra con acentos vibrantes */
    :root {
      --bg: #f9f9f9;
      --surface: #ffffff;
      --text: #1e1e2f;
      --text-light: #5a5a6e;
      --accent-1: #ff6b4a;  /* naranja vibrante */
      --accent-2: #4a90e2;  /* azul brillante */
      --accent-3: #f5a623;  /* amarillo dorado */
      --accent-4: #7ed321;  /* verde lima */
      --border: rgba(0,0,0,0.08);
      --shadow: rgba(0,0,0,0.04);
      --font-title: 'Syne', sans-serif;
      --font-body: 'Inter', sans-serif;
      --header-height: 80px;
      --border-radius: 16px;
    }
    /* Tema oscuro – los acentos se mantienen vibrantes pero el fondo es más profundo */
    body.dark {
      --bg: #121212;
      --surface: #1e1e2a;
      --text: #efefef;
      --text-light: #a0a0b0;
      --border: rgba(255,255,255,0.1);
      --shadow: rgba(0,0,0,0.3);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      transition: background-color 0.3s, color 0.3s;
      line-height: 1.6;
      scroll-behavior: smooth;
    }
    .container {
      max-width: 1280px;
      margin: 0 auto;
      padding: 0 2rem;
    }
    /* Header más limpio */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: var(--header-height);
      margin-bottom: 2rem;
      border-bottom: 2px solid var(--border);
    }
    .logo {
      font-family: var(--font-title);
      font-size: 1.8rem;
      font-weight: 800;
      color: var(--accent-1);
      text-decoration: none;
      letter-spacing: -0.02em;
    }
    .theme-toggle {
      background: transparent;
      border: 2px solid var(--accent-2);
      color: var(--text);
      font-size: 1rem;
      padding: 0.5rem 1.2rem;
      border-radius: 30px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-weight: 600;
      transition: 0.2s;
    }
    .theme-toggle:hover {
      background: var(--accent-2);
      color: white;
    }
    /* Navegación más elegante */
    .nav {
      display: flex;
      gap: 2rem;
      justify-content: center;
      margin: 2rem 0 4rem;
      flex-wrap: wrap;
    }
    .nav a {
      font-family: var(--font-title);
      font-weight: 600;
      text-decoration: none;
      color: var(--text);
      padding: 0.5rem 0;
      border-bottom: 3px solid transparent;
      transition: 0.2s;
      font-size: 1.1rem;
    }
    .nav a:hover {
      border-bottom-color: var(--accent-1);
      color: var(--accent-1);
    }
    /* Hero más estructurado */
    .hero {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4rem;
      align-items: center;
      margin-bottom: 5rem;
      background: var(--surface);
      padding: 3rem;
      border-radius: var(--border-radius);
      box-shadow: 0 20px 40px var(--shadow);
    }
    .hero-title {
      font-family: var(--font-title);
      font-size: clamp(2.8rem, 6vw, 4.5rem);
      font-weight: 800;
      line-height: 1.1;
      letter-spacing: -0.02em;
      color: var(--text);
    }
    .hero-title .highlight {
      color: var(--accent-1);
      display: inline-block;
      background: linear-gradient(145deg, var(--accent-1), var(--accent-2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .hero-desc {
      font-size: 1.2rem;
      color: var(--text-light);
      margin: 1.5rem 0 2rem;
      max-width: 450px;
    }
    .hero-image {
      border-radius: var(--border-radius);
      overflow: hidden;
      box-shadow: 0 20px 30px var(--shadow);
      transition: transform 0.3s;
    }
    .hero-image:hover {
      transform: scale(1.02);
    }
    .hero-image img {
      width: 100%;
      height: auto;
      display: block;
    }
    /* Sección título con acento */
    .section-title {
      font-family: var(--font-title);
      font-size: 2.5rem;
      font-weight: 700;
      margin: 4rem 0 2rem;
      position: relative;
      display: inline-block;
    }
    .section-title::after {
      content: '';
      position: absolute;
      bottom: -8px;
      left: 0;
      width: 60px;
      height: 4px;
      background: var(--accent-1);
      border-radius: 4px;
    }
    /* Servicios – tarjetas con acentos sutiles */
    .services {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 2rem;
      margin: 3rem 0;
    }
    .service-card {
      background: var(--surface);
      padding: 2rem;
      border-radius: var(--border-radius);
      box-shadow: 0 8px 20px var(--shadow);
      transition: 0.25s;
      border-bottom: 4px solid transparent;
    }
    .service-card:hover {
      transform: translateY(-6px);
      border-bottom-color: var(--accent-1);
      box-shadow: 0 15px 30px var(--shadow);
    }
    .service-icon {
      font-size: 2.8rem;
      margin-bottom: 1rem;
    }
    .service-title {
      font-family: var(--font-title);
      font-size: 1.6rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
    }
    .service-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-top: 1.5rem;
    }
    .tag {
      background: var(--bg);
      color: var(--text-light);
      padding: 0.2rem 1rem;
      border-radius: 30px;
      font-size: 0.8rem;
      font-weight: 500;
      border: 1px solid var(--border);
    }
    /* Galería en mosaico elegante */
    .gallery {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1.5rem;
      margin: 3rem 0;
    }
    .gallery-item {
      border-radius: var(--border-radius);
      overflow: hidden;
      aspect-ratio: 1 / 1;
      box-shadow: 0 5px 15px var(--shadow);
      transition: 0.3s;
    }
    .gallery-item:hover {
      transform: scale(1.03);
      box-shadow: 0 15px 30px var(--shadow);
    }
    .gallery-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    /* About con foto y texto equilibrado */
    .about {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 3rem;
      background: var(--surface);
      border-radius: var(--border-radius);
      padding: 3rem;
      box-shadow: 0 20px 40px var(--shadow);
      margin: 3rem 0;
    }
    .about-photo {
      border-radius: var(--border-radius);
      overflow: hidden;
    }
    .about-photo img {
      width: 100%;
      height: auto;
      display: block;
    }
    .about-text {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }
    .about-text p {
      font-size: 1.1rem;
      color: var(--text-light);
    }
    .fun-facts {
      display: flex;
      flex-wrap: wrap;
      gap: 0.8rem;
      margin-top: 1rem;
    }
    .fact {
      background: var(--accent-1);
      color: white;
      padding: 0.4rem 1.2rem;
      border-radius: 40px;
      font-weight: 500;
      font-size: 0.9rem;
    }
    /* Testimonial más sobrio pero con color */
    .testimonial {
      background: linear-gradient(145deg, var(--surface), var(--bg));
      border-left: 8px solid var(--accent-2);
      border-radius: var(--border-radius);
      padding: 3rem;
      font-size: 1.5rem;
      font-weight: 300;
      font-style: italic;
      margin: 4rem 0;
      box-shadow: 0 20px 40px var(--shadow);
    }
    .testimonial-author {
      margin-top: 2rem;
      font-style: normal;
      font-weight: 600;
      color: var(--accent-1);
    }
    /* Contacto – dos columnas limpias */
    .contact {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 3rem;
      background: var(--surface);
      border-radius: var(--border-radius);
      padding: 3rem;
      box-shadow: 0 20px 40px var(--shadow);
      margin: 4rem 0;
    }
    .contact-left h2 {
      font-family: var(--font-title);
      font-size: 2.2rem;
      font-weight: 700;
      margin-bottom: 2rem;
    }
    .contact-info {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .contact-link {
      display: flex;
      align-items: center;
      gap: 1rem;
      text-decoration: none;
      color: var(--text);
      font-size: 1.1rem;
      padding: 0.8rem 1.2rem;
      background: var(--bg);
      border-radius: 60px;
      transition: 0.2s;
      border: 1px solid var(--border);
    }
    .contact-link:hover {
      background: var(--accent-1);
      color: white;
      border-color: var(--accent-1);
    }
    .contact-form {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }
    .form-group label {
      font-weight: 600;
      color: var(--text-light);
    }
    .form-group input,
    .form-group textarea {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 0.8rem 1rem;
      font-family: var(--font-body);
      color: var(--text);
      outline: none;
      transition: 0.2s;
    }
    .form-group input:focus,
    .form-group textarea:focus {
      border-color: var(--accent-1);
      box-shadow: 0 0 0 3px rgba(255,107,74,0.1);
    }
    .submit-btn {
      background: var(--accent-1);
      color: white;
      border: none;
      padding: 1rem 2rem;
      font-family: var(--font-title);
      font-weight: 600;
      font-size: 1.1rem;
      border-radius: 60px;
      cursor: pointer;
      transition: 0.2s;
      align-self: flex-start;
    }
    .submit-btn:hover {
      background: var(--accent-2);
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(0,0,0,0.1);
    }
    /* Footer simple */
    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 2rem 0;
      border-top: 1px solid var(--border);
      margin-top: 3rem;
      flex-wrap: wrap;
      gap: 1rem;
    }
    .social a {
      color: var(--text-light);
      text-decoration: none;
      margin-left: 1.5rem;
      font-weight: 500;
      transition: 0.2s;
    }
    .social a:hover {
      color: var(--accent-1);
    }
    /* Responsive */
    @media (max-width: 900px) {
      .hero, .about, .contact { grid-template-columns: 1fr; }
      .gallery { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 600px) {
      .gallery { grid-template-columns: 1fr; }
      .nav { gap: 1rem; }
    }
    /* Animación fade-up */
    .fade-up {
      opacity: 0;
      transform: translateY(30px);
      transition: opacity 0.6s, transform 0.6s;
    }
    .fade-up.visible {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>
<body>
<div class="container">
  <!-- Header -->
  <header class="header">
    <a href="#" class="logo" id="logo"></a>
    <button class="theme-toggle" id="theme-toggle">
      <span id="theme-icon">☀️</span>
      <span>Tema</span>
    </button>
  </header>

  <!-- Navegación -->
  <nav class="nav">
    <a href="#servicios">Servicios</a>
    <a href="#trabajos">Trabajos</a>
    <a href="#sobre-mi">Sobre mí</a>
    <a href="#contacto">Contacto</a>
  </nav>

  <!-- Hero -->
  <section class="hero fade-up" id="hero">
    <div>
      <h1 class="hero-title" id="hero-title"></h1>
      <p class="hero-desc" id="hero-desc"></p>
    </div>
    <div class="hero-image">
      <img id="hero-image" src="" alt="hero">
    </div>
  </section>

  <!-- Servicios -->
  <section id="servicios">
    <h2 class="section-title">Servicios</h2>
    <div class="services" id="services-grid"></div>
  </section>

  <!-- Galería de trabajos -->
  <section id="trabajos">
    <h2 class="section-title">Trabajos recientes</h2>
    <div class="gallery" id="gallery"></div>
  </section>

  <!-- Sobre mí -->
  <section id="sobre-mi">
    <h2 class="section-title">Sobre mí</h2>
    <div class="about">
      <div class="about-photo">
        <img id="about-image" src="" alt="about">
      </div>
      <div class="about-text" id="about-text"></div>
    </div>
  </section>

  <!-- Testimonial -->
  <section id="testimonial">
    <div class="testimonial" id="testimonial-quote"></div>
  </section>

  <!-- Contacto -->
  <section id="contacto">
    <h2 class="section-title">Contacto</h2>
    <div class="contact">
      <div class="contact-left">
        <h2 id="contact-headline"></h2>
        <div class="contact-info" id="contact-info"></div>
      </div>
      <div class="contact-right">
        <form class="contact-form" onsubmit="handleSubmit(event)">
          <div class="form-group">
            <label>Nombre</label>
            <input type="text" placeholder="Tu nombre" required>
          </div>
          <div class="form-group">
            <label>Email</label>
            <input type="email" placeholder="tu@email.com" required>
          </div>
          <div class="form-group">
            <label>Mensaje</label>
            <textarea rows="4" placeholder="Cuéntame tu proyecto..." required></textarea>
          </div>
          <button type="submit" class="submit-btn">Enviar mensaje</button>
        </form>
      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer class="footer">
    <div id="footer-copy"></div>
    <div class="social" id="social-links"></div>
  </footer>
</div>

<script>
// ================= CONFIGURACIÓN VIBRANTE PERO PROFESIONAL =================
const CONFIG = {
  nombre: "Martina Ruiz",
  logo: "MARTINA RUIZ",  // más profesional que solo iniciales

  hero: {
    titulo: "Diseño gráfico <span class='highlight'>con carácter</span>",
    descripcion: "Ayudo a marcas y proyectos a encontrar su voz visual a través de un diseño atrevido pero estratégico.",
    imagen: "https://images.unsplash.com/photo-1579546929518-9e396f3cc809?w=600&q=80"
  },

  servicios: [
    { icon: "🎯", titulo: "Branding", desc: "Identidades de marca que conectan emocionalmente y destacan en el mercado.", tags: ["Estrategia", "Logotipo", "Guía de estilo"] },
    { icon: "🖍️", titulo: "Ilustración", desc: "Ilustraciones personalizadas con estilo único para editorial, digital o mural.", tags: ["Digital", "Vectorial", "Handmade"] },
    { icon: "📸", titulo: "Diseño digital", desc: "Diseño para redes sociales, web y contenido interactivo con alto impacto.", tags: ["UI", "Motion", "Social media"] },
    { icon: "🧪", titulo: "Proyectos especiales", desc: "Colaboraciones experimentales donde el diseño se encuentra con otras disciplinas.", tags: ["Arte", "Instalaciones", "Workshops"] }
  ],

  gallery: [
    "https://images.unsplash.com/photo-1558591710-4b4a1ae0f04d?w=400&q=80",
    "https://images.unsplash.com/photo-1586717791821-3f44a563fa4c?w=400&q=80",
    "https://images.unsplash.com/photo-1561070791-2526d30994b5?w=400&q=80",
    "https://images.unsplash.com/photo-1541701494587-c5a79c6afdd0?w=400&q=80",
    "https://images.unsplash.com/photo-1605721912198-700da22917c9?w=400&q=80",
    "https://images.unsplash.com/photo-1542744095-291d1f67b221?w=400&q=80",
    "https://images.unsplash.com/photo-1558591710-4b4a1ae0f04d?w=400&q=80",
    "https://images.unsplash.com/photo-1586717791821-3f44a563fa4c?w=400&q=80"
  ],

  about: {
    imagen: "https://images.unsplash.com/photo-1611432579699-484f7990b127?w=400&q=80",
    texto: "<p><strong>¡Hola! Soy Martina, diseñadora gráfica desde 2017.</strong> Me apasiona crear identidades visuales que cuentan historias y generan impacto. He trabajado con startups, marcas consolidadas y proyectos culturales, siempre buscando el equilibrio entre la experimentación y la funcionalidad.</p><p>Cuando no estoy diseñando, disfruto explorando nuevas técnicas de ilustración, la fotografía analógica y el café de especialidad. ¿Charlamos?</p>",
    facts: ["Tipografía", "Color", "Café", "Arte urbano", "Música"]
  },

  testimonial: {
    quote: "Martina captó la esencia de nuestra marca y la transformó en algo visualmente potente y coherente. Su enfoque estratégico y su creatividad hicieron que el proceso fuera inspirador.",
    autor: "— Carla Méndez, fundadora de 'La Casa Amarilla'"
  },

  contacto: {
    titular: "¿Tienes un proyecto en mente?",
    links: [
      { label: "✉️", texto: "martina@disenadora.com", url: "mailto:martina@disenadora.com" },
      { label: "📷", texto: "@martina.design", url: "https://instagram.com" },
      { label: "💼", texto: "LinkedIn", url: "https://linkedin.com" },
      { label: "🖌️", texto: "Behance", url: "https://behance.net" }
    ]
  },

  social: [
    { nombre: "Instagram", url: "#" },
    { nombre: "Behance", url: "#" },
    { nombre: "LinkedIn", url: "#" }
  ],

  copyright: "© 2025 Martina Ruiz · Diseño gráfico profesional"
};

// ========== APLICAR CONFIG ==========
document.getElementById('page-title').textContent = `${CONFIG.nombre} · Diseño gráfico`;
document.getElementById('logo').textContent = CONFIG.logo;

// Hero
document.getElementById('hero-title').innerHTML = CONFIG.hero.titulo;
document.getElementById('hero-desc').textContent = CONFIG.hero.descripcion;
document.getElementById('hero-image').src = CONFIG.hero.imagen;

// Servicios
const servicesGrid = document.getElementById('services-grid');
servicesGrid.innerHTML = CONFIG.servicios.map(s => `
  <div class="service-card fade-up">
    <div class="service-icon">${s.icon}</div>
    <h3 class="service-title">${s.titulo}</h3>
    <p>${s.desc}</p>
    <div class="service-tags">${s.tags.map(t => `<span class="tag">${t}</span>`).join('')}</div>
  </div>
`).join('');

// Galería
const gallery = document.getElementById('gallery');
gallery.innerHTML = CONFIG.gallery.map(url => `
  <div class="gallery-item fade-up">
    <img src="${url}" alt="trabajo">
  </div>
`).join('');

// Sobre mí
document.getElementById('about-image').src = CONFIG.about.imagen;
const aboutText = document.getElementById('about-text');
aboutText.innerHTML = CONFIG.about.texto;
const factsDiv = document.createElement('div');
factsDiv.className = 'fun-facts';
factsDiv.innerHTML = CONFIG.about.facts.map(f => `<span class="fact">✨ ${f}</span>`).join('');
aboutText.appendChild(factsDiv);

// Testimonial
document.getElementById('testimonial-quote').innerHTML = `
  ${CONFIG.testimonial.quote}
  <div class="testimonial-author">${CONFIG.testimonial.autor}</div>
`;

// Contacto
document.getElementById('contact-headline').textContent = CONFIG.contacto.titular;
const contactInfo = document.getElementById('contact-info');
contactInfo.innerHTML = CONFIG.contacto.links.map(l => `
  <a href="${l.url}" class="contact-link">
    <span>${l.label}</span> ${l.texto}
  </a>
`).join('');

// Footer
document.getElementById('footer-copy').textContent = CONFIG.copyright;
const socialLinks = document.getElementById('social-links');
socialLinks.innerHTML = CONFIG.social.map(s => `<a href="${s.url}">${s.nombre}</a>`).join('');

// ========== TOGGLE TEMA ==========
const themeToggle = document.getElementById('theme-toggle');
const themeIcon = document.getElementById('theme-icon');
let darkMode = false;

function setTheme(theme) {
  if (theme === 'dark') {
    document.body.classList.add('dark');
    themeIcon.textContent = '🌙';
  } else {
    document.body.classList.remove('dark');
    themeIcon.textContent = '☀️';
  }
}

themeToggle.addEventListener('click', () => {
  darkMode = !darkMode;
  setTheme(darkMode ? 'dark' : 'light');
});
setTheme('light');

// ========== ANIMACIÓN FADE-UP ==========
const observer = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    if (entry.isIntersecting) {
      entry.target.classList.add('visible');
      observer.unobserve(entry.target);
    }
  });
}, { threshold: 0.2 });
document.querySelectorAll('.fade-up').forEach(el => observer.observe(el));

// ========== FORMULARIO SIMULADO ==========
function handleSubmit(e) {
  e.preventDefault();
  const btn = e.target.querySelector('.submit-btn');
  btn.textContent = '¡Enviado!';
  btn.style.background = 'var(--accent-2)';
  setTimeout(() => {
    btn.textContent = 'Enviar mensaje';
    e.target.reset();
  }, 2000);
}
</script>
</body>
</html>
